services:
  backend:
    build:
      context: ./backend
    container_name: artarchive-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    networks:
      - artarchive-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: artarchive-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - artarchive-network
    restart: unless-stopped

networks:
  artarchive-network:
    driver: bridge